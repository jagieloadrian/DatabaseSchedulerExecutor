name: Kotlin Gradle CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build project
        run: ./gradlew build

      # Guards the release jar itself: it must start (reach arg validation)
      # and register every JDBC driver (one per DbType, merged service files).
      - name: Smoke test release jar
        run: |
          JAR=$(ls build/libs/DatabaseScheduleExecutor-*.jar)
          out=$(java -jar "$JAR" 2>&1 || true)
          grep -q "Invalid input config file path" <<< "$out"
          echo 'public class D { public static void main(String[] a) { System.out.println(java.sql.DriverManager.drivers().count()); } }' > "$RUNNER_TEMP/D.java"
          test "$(java -cp "$JAR" "$RUNNER_TEMP/D.java")" = 6

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run shell script tests
        run: bats scripts/test/run_kill.bats scripts/test/install_service.bats

  test-windows-install:
    name: Test Windows install script
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build jar
        run: .\gradlew.bat assemble

      - name: Stage install folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path install-test | Out-Null
          Copy-Item build\libs\DatabaseScheduleExecutor-*.jar install-test\
          Copy-Item src\main\resources\app.properties install-test\
          Copy-Item scripts\install-service.ps1 install-test\

      - name: Run install-service.ps1
        shell: pwsh
        working-directory: install-test
        run: .\install-service.ps1

      - name: Verify scheduled task was created
        shell: pwsh
        run: schtasks /Query /TN DatabaseSchedulerExecutor

      - name: Uninstall (also verifies README uninstall command)
        if: always()
        shell: pwsh
        run: schtasks /Delete /TN DatabaseSchedulerExecutor /F

  release:
    name: Release on merge
    runs-on: ubuntu-latest
    needs: [build, test-windows-install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build release zip
        run: ./gradlew releaseZip

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Push to main without a version bump keeps main green instead of
      # failing on the already existing tag.
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          skipIfReleaseExists: true
          artifacts: build/distributions/*
