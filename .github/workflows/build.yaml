name: Kotlin Gradle CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build project
        run: ./gradlew build

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run shell script tests
        run: bats scripts/test/run_kill.bats scripts/test/install_service.bats

  test-windows-install:
    name: Test Windows install script
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build jar
        run: .\gradlew.bat assemble

      - name: Stage install folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path install-test | Out-Null
          Copy-Item build\libs\DatabaseScheduleExecutor-*.jar install-test\
          Copy-Item src\main\resources\app.properties install-test\
          Copy-Item scripts\install-service.ps1 install-test\

      - name: Run install-service.ps1
        shell: pwsh
        working-directory: install-test
        run: .\install-service.ps1

      - name: Verify scheduled task was created
        shell: pwsh
        run: schtasks /Query /TN DatabaseSchedulerExecutor

      - name: Uninstall (also verifies README uninstall command)
        if: always()
        shell: pwsh
        run: schtasks /Delete /TN DatabaseSchedulerExecutor /F

  release:
    name: Release on merge
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: build/distributions/*
